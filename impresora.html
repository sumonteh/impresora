<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phomemo M02 · imprimir sin la app</title>
<style>
  :root{
    --paper:#f3f1ea; --paper-hi:#fbfaf6; --edge:#e7e3d7;
    --ink:#1c1a17; --ink-soft:#5a554c; --thermal:#b23a2e; --ok:#2f6b4f;
    --rule:#c9c3b4;
    --mono: ui-monospace,"Cascadia Code","SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:#d9d5c8;color:var(--ink);font-family:var(--mono);
       line-height:1.5;padding:18px 12px 60px;-webkit-font-smoothing:antialiased}
  .receipt{max-width:560px;margin:0 auto;background:var(--paper);
           padding:26px 22px 30px;position:relative;box-shadow:0 10px 30px rgba(0,0,0,.18)}
  .receipt::before,.receipt::after{content:"";position:absolute;left:0;right:0;height:12px;
    background:radial-gradient(circle at 6px -3px,transparent 6px,var(--paper) 6.5px) 0 0/12px 12px repeat-x}
  .receipt::before{top:-11px;transform:scaleY(-1)}
  .receipt::after{bottom:-11px}
  header{text-align:center;border-bottom:2px dashed var(--rule);padding-bottom:16px}
  h1{font-size:15px;letter-spacing:.16em;margin:0 0 4px;text-transform:uppercase}
  .sub{font-size:11.5px;color:var(--ink-soft);letter-spacing:.04em}
  .meta{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-soft);
        margin-top:14px;letter-spacing:.06em}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--rule);display:inline-block;
       margin-right:6px;vertical-align:middle}
  .dot.on{background:var(--ok)}

  .lbl{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft);
       margin:22px 0 10px}
  .tabs{display:flex;gap:8px;margin-top:18px}
  .tab{flex:1;text-align:center;padding:10px;border:1.5px solid var(--ink);cursor:pointer;
       font-size:12px;letter-spacing:.06em;text-transform:uppercase;background:transparent}
  .tab.active{background:var(--ink);color:var(--paper)}

  textarea,input[type=file]{width:100%;font-family:var(--mono);font-size:13px;
       background:var(--paper-hi);border:1px solid var(--rule);color:var(--ink);padding:10px}
  textarea{height:120px;resize:vertical}
  input[type=file]{padding:8px}

  .ctrl{margin-top:16px}
  .ctrl label{font-size:11px;letter-spacing:.05em;color:var(--ink-soft);display:flex;
              justify-content:space-between;margin-bottom:6px}
  input[type=range]{width:100%;accent-color:var(--thermal)}
  .seg{display:flex;gap:6px;margin-top:6px}
  .seg button{flex:1;padding:8px;font-size:11px;border:1px solid var(--ink);background:transparent;
              cursor:pointer;text-transform:uppercase;letter-spacing:.05em}
  .seg button.active{background:var(--ink);color:var(--paper)}

  .preview-wrap{margin-top:22px;text-align:center;background:var(--paper-hi);
       border:1px solid var(--rule);padding:16px 0}
  .preview-cap{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);
       margin-bottom:12px}
  canvas#preview{width:288px;max-width:88%;height:auto;image-rendering:pixelated;
       background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12)}

  button.act{font-family:var(--mono);font-size:14px;letter-spacing:.05em;width:100%;
       padding:14px;margin-top:16px;cursor:pointer;background:var(--ink);color:var(--paper);
       border:none;text-transform:uppercase;transition:transform .05s,background .15s}
  button.act:hover{background:#000}
  button.act:active{transform:translateY(1px)}
  button.act:disabled{background:var(--rule);color:#8f897c;cursor:not-allowed}
  button.act.print{background:var(--thermal)}
  button.act.print:hover{background:#9a3025}

  .status{margin-top:16px;font-size:12px;min-height:18px;letter-spacing:.03em}
  .status.err{color:var(--thermal)} .status.ok{color:var(--ok)}
  .warn{background:#f6ede6;border:1px solid #e3c4b8;color:#7a3327;font-size:11.5px;
        padding:10px 12px;margin-top:16px;display:none}
  .foot{text-align:center;font-size:10.5px;color:var(--ink-soft);margin-top:26px;
        border-top:2px dashed var(--rule);padding-top:16px;letter-spacing:.05em}
</style>
</head>
<body>
<main class="receipt">
  <header>
    <h1>Phomemo M02</h1>
    <div class="sub">imprimir directo · sin la app</div>
    <div class="meta">
      <span><span id="dot" class="dot"></span><span id="conn">Sin conectar</span></span>
      <span>384 px · ESC/POS</span>
    </div>
  </header>

  <div id="warn" class="warn"></div>

  <div class="tabs">
    <div class="tab active" data-mode="text">Texto</div>
    <div class="tab" data-mode="image">Imagen</div>
  </div>

  <div id="panelText">
    <div class="lbl">Contenido</div>
    <textarea id="text" placeholder="Escribe aquí…&#10;Se imprime tal cual, ajustado al ancho.">Hola desde
la M02 🖨️</textarea>
    <div class="ctrl">
      <label>Tamaño de letra <span id="fsVal">30 px</span></label>
      <input type="range" id="fs" min="16" max="64" value="30">
    </div>
    <div class="ctrl">
      <label>Alineación</label>
      <div class="seg" id="align">
        <button data-a="left">Izq.</button>
        <button data-a="center" class="active">Centro</button>
        <button data-a="right">Der.</button>
      </div>
    </div>
  </div>

  <div id="panelImage" style="display:none">
    <div class="lbl">Imagen</div>
    <input type="file" id="file" accept="image/*">
    <div class="ctrl">
      <label>Procesado</label>
      <div class="seg" id="proc">
        <button data-p="threshold" class="active">Nítido (texto/dibujo)</button>
        <button data-p="dither">Difuminado (foto)</button>
      </div>
    </div>
  </div>

  <div class="ctrl">
    <label>Umbral / oscuridad <span id="thVal">128</span></label>
    <input type="range" id="th" min="40" max="220" value="128">
  </div>

  <div class="ctrl">
    <label>Copias <span id="copiesVal">1</span></label>
    <input type="range" id="copies" min="1" max="10" value="1">
  </div>

  <div class="preview-wrap">
    <div class="preview-cap">Vista previa (tamaño real de impresión)</div>
    <canvas id="preview" width="384" height="200"></canvas>
    <div id="sizeInfo" style="font-size:10px;letter-spacing:.12em;text-transform:uppercase;
         color:var(--ink-soft);margin-top:12px">—</div>
  </div>

  <button id="connect" class="act">⟐ Conectar impresora</button>
  <button id="print" class="act print" disabled>▐ Imprimir</button>
  <button id="stop" class="act" style="display:none;background:#7a3327">■ Detener</button>

  <div id="status" class="status">Enciende la M02 (3 s) y tenla cerca.</div>

  <div class="foot">
    Chrome/Edge en Android o escritorio · servir por https.<br>
    En iPhone usa el navegador Bluefy. · versión <b id="ver">v9</b>
  </div>
</main>

<script>
const WIDTH=384, RB=48;               // 384 puntos = 48 bytes por línea
const $=id=>document.getElementById(id);
const cv=$("preview"), ctx=cv.getContext("2d",{willReadFrequently:true});
let mode="text", proc="threshold", align="center", img=null, writeChar=null, device=null;
let printing=false;   // candado: un toque = una sola impresión
let abort=false;      // bandera para detener el envío en curso

const setStatus=(m,c="")=>{$("status").textContent=m;$("status").className="status "+c;};

// ---- soporte ----
if(!navigator.bluetooth){
  const w=$("warn"); w.style.display="block";
  w.innerHTML="Este navegador no soporta Web Bluetooth. Usa <b>Chrome/Edge</b> en Android o "+
              "escritorio; en iPhone/iPad, el navegador <b>Bluefy</b>. La página debe abrirse por <b>https</b>.";
  $("connect").disabled=true;
}

// ---- tabs y controles ----
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  t.classList.add("active"); mode=t.dataset.mode;
  $("panelText").style.display = mode==="text"?"block":"none";
  $("panelImage").style.display= mode==="image"?"block":"none";
  render();
});
$("align").onclick=e=>{const b=e.target.closest("button"); if(!b)return;
  align=b.dataset.a; [...$("align").children].forEach(x=>x.classList.toggle("active",x===b)); render();};
$("proc").onclick=e=>{const b=e.target.closest("button"); if(!b)return;
  proc=b.dataset.p; [...$("proc").children].forEach(x=>x.classList.toggle("active",x===b)); render();};
$("fs").oninput=()=>{$("fsVal").textContent=$("fs").value+" px"; render();};
$("th").oninput=()=>{$("thVal").textContent=$("th").value; render();};
$("copies").oninput=()=>{$("copiesVal").textContent=$("copies").value;};
$("text").oninput=render;
$("file").onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const im=new Image(); im.onload=()=>{img=im; render();}; im.src=URL.createObjectURL(f);
};

// ---- render al canvas 384 de ancho ----
function render(){
  if(mode==="text") renderText(); else renderImage();
  const el=$("sizeInfo");
  if(el) el.textContent = cv.height+" líneas · "+(RB*cv.height/1024).toFixed(1)+" KB · "+
    (RB*cv.height + 20)+" B totales";
}
function renderText(){
  const size=+$("fs").value, pad=8, lh=Math.round(size*1.25);
  ctx.font=`${size}px ${getComputedStyle(document.body).fontFamily}`;
  // word-wrap manual respetando saltos de línea
  const lines=[];
  ($("text").value||" ").split("\n").forEach(par=>{
    const words=par.split(" "); let cur="";
    for(const w of words){
      const test=cur?cur+" "+w:w;
      if(ctx.measureText(test).width>WIDTH-pad*2 && cur){lines.push(cur); cur=w;}
      else cur=test;
    }
    lines.push(cur);
  });
  const h=Math.max(lh, lines.length*lh+pad*2);
  cv.width=WIDTH; cv.height=h;
  ctx.fillStyle="#fff"; ctx.fillRect(0,0,WIDTH,h);
  ctx.fillStyle="#000"; ctx.textBaseline="top";
  ctx.font=`${size}px ${getComputedStyle(document.body).fontFamily}`;
  lines.forEach((ln,i)=>{
    const w=ctx.measureText(ln).width;
    let x=pad; if(align==="center")x=(WIDTH-w)/2; if(align==="right")x=WIDTH-w-pad;
    ctx.fillText(ln,x,pad+i*lh);
  });
}
function renderImage(){
  if(!img){cv.width=WIDTH;cv.height=120;ctx.fillStyle="#fff";ctx.fillRect(0,0,WIDTH,120);
    ctx.fillStyle="#b8b2a3";ctx.textAlign="center";ctx.font="16px monospace";
    ctx.fillText("Elige una imagen…",WIDTH/2,56);ctx.textAlign="left";return;}
  const h=Math.round(WIDTH*img.height/img.width);
  cv.width=WIDTH; cv.height=h;
  ctx.fillStyle="#fff"; ctx.fillRect(0,0,WIDTH,h);
  ctx.drawImage(img,0,0,WIDTH,h);
  applyMono();
}
// convierte el canvas a blanco/negro (para vista previa fiel)
function applyMono(){
  const th=+$("th").value, d=ctx.getImageData(0,0,cv.width,cv.height), px=d.data, W=cv.width, H=cv.height;
  const g=new Float32Array(W*H);
  for(let i=0;i<W*H;i++){
    const a=px[i*4+3]/255;
    const lum=(0.299*px[i*4]+0.587*px[i*4+1]+0.114*px[i*4+2])*a + 255*(1-a);
    g[i]=lum;
  }
  if(mode==="image" && proc==="dither"){
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){
      const i=y*W+x, old=g[i], nw=old<th?0:255, err=old-nw; g[i]=nw;
      if(x+1<W)g[i+1]+=err*7/16;
      if(y+1<H){ if(x>0)g[i+W-1]+=err*3/16; g[i+W]+=err*5/16; if(x+1<W)g[i+W+1]+=err*1/16; }
    }
  }else{
    for(let i=0;i<W*H;i++) g[i]=g[i]<th?0:255;
  }
  for(let i=0;i<W*H;i++){const v=g[i]; px[i*4]=px[i*4+1]=px[i*4+2]=v; px[i*4+3]=255;}
  ctx.putImageData(d,0,0);
}

// ---- empaquetar a 1bpp (1=negro) ----
function pack(){
  if(mode==="image" && !img) return null;
  applyMono();                                  // asegura B/N
  const d=ctx.getImageData(0,0,WIDTH,cv.height).data, H=cv.height;
  const out=new Uint8Array(RB*H);
  for(let y=0;y<H;y++)for(let x=0;x<WIDTH;x++){
    const black = d[(y*WIDTH+x)*4] < 128;
    if(black) out[y*RB + (x>>3)] |= (0x80 >> (x&7));
  }
  return {out,H};
}

// ---- comandos ESC/POS de la M02 ----
function buildStream(packed,H){
  const parts=[];
  parts.push([0x1b,0x40]);            // ESC @  inicializa
  parts.push([0x1b,0x61,0x01]);       // ESC a  centrar
  let y=0;
  while(y<H){
    const n=Math.min(255,H-y);
    parts.push([0x1d,0x76,0x30,0x00, RB&0xff,(RB>>8)&0xff, n&0xff,(n>>8)&0xff]); // GS v 0
    parts.push(packed.subarray(y*RB,(y+n)*RB));
    y+=n;
  }
  parts.push([0x1b,0x64,0x03]);       // avanza 3 líneas para el corte
  parts.push([0x1b,0x64,0x03]);
  parts.push([0x1b,0x40]);            // ESC @  reset final: limpia estado residual
  let len=0; parts.forEach(p=>len+=p.length);
  const buf=new Uint8Array(len); let o=0;
  parts.forEach(p=>{buf.set(p,o); o+=p.length;});
  return buf;
}

// ---- conectar por BLE ----
$("connect").onclick=async()=>{
  try{
    setStatus("Elige tu impresora (M02 o número de serie Qxxx)…");
    // Bluefy (iOS) NO acepta UUIDs numéricos cortos (0xff00); van en forma larga de 128 bits.
    device=await navigator.bluetooth.requestDevice({
      acceptAllDevices:true,
      optionalServices:[
        "0000ff00-0000-1000-8000-00805f9b34fb",  // servicio principal M02
        "0000ff02-0000-1000-8000-00805f9b34fb",  // característica de escritura
        "000018f0-0000-1000-8000-00805f9b34fb",  // variantes Phomemo
        "0000ae30-0000-1000-8000-00805f9b34fb",
        "49535343-fe7d-4ae5-8fa9-9fafd205e455"   // UART transparente (algunos firmwares)
      ]
    });
    device.addEventListener("gattserverdisconnected",onDisc);
    const server=await device.gatt.connect();
    const services=await server.getPrimaryServices();
    // busca característica de escritura (prioriza ff02)
    for(const s of services){
      for(const c of await s.getCharacteristics()){
        if(c.uuid.includes("ff02")) writeChar=c;
      }
    }
    if(!writeChar) for(const s of services){
      for(const c of await s.getCharacteristics()){
        if(!writeChar && (c.properties.writeWithoutResponse||c.properties.write)) writeChar=c;
      }
    }
    if(!writeChar) throw new Error("No encontré un canal de escritura. Pásame el reporte del inspector.");
    $("dot").classList.add("on"); $("conn").textContent=device.name||"Conectada";
    $("print").disabled=false;
    setStatus("Conectada. Lista para imprimir.","ok");
  }catch(err){
    if(err.name==="NotFoundError") setStatus("Cancelado o no elegiste impresora.");
    else setStatus("Error: "+(err.message||err.name||err),"err");
  }
};
function onDisc(){writeChar=null;$("dot").classList.remove("on");$("conn").textContent="Sin conectar";
  $("print").disabled=true; setStatus("Se desconectó la impresora.","err");}

// ---- imprimir ----
$("print").onclick=async()=>{
  if(!writeChar || printing) return;   // ignora toques repetidos mientras imprime
  const p=pack();
  if(!p){setStatus("Elige una imagen primero.","err");return;}
  const copies=Math.max(1,Math.min(10, parseInt($("copies").value,10)||1));
  const stream=buildStream(p.out,p.H);
  const kb=(stream.length/1024).toFixed(1);
  try{
    printing=true; abort=false;
    $("print").disabled=true; $("stop").style.display="block";
    // Escritura CON respuesta si el equipo la permite: cada trozo se confirma
    // (ACK) por el equipo, así garantizamos orden y no perder bytes por BLE.
    const reliable = writeChar.properties.write;
    const CHUNK=100;
    // Margen para que la copia termine de imprimirse físicamente (avance del
    // papel) antes de mandar la siguiente, y no se encabalguen.
    const settle=Math.min(5000, 400 + p.H*5);
    for(let c=1;c<=copies && !abort;c++){
      for(let i=0;i<stream.length && !abort;i+=CHUNK){
        const part=stream.subarray(i,i+CHUNK);
        if(reliable) await writeChar.writeValue(part);
        else         await writeChar.writeValueWithoutResponse(part);
        if(!reliable) await new Promise(r=>setTimeout(r,24));
        const pct=Math.min(100,Math.round((i+CHUNK)/stream.length*100));
        setStatus(`Copia ${c}/${copies} · ${p.H} líneas · ${kb} KB — ${pct}%`);
      }
      if(!abort){
        setStatus(`Copia ${c}/${copies} impresa.`,"ok");
        if(c<copies) await new Promise(r=>setTimeout(r,settle));
      }
    }
    setStatus(abort ? "Detenido." : `¡Listo! ${copies} copia${copies>1?"s":""} · ${p.H} líneas.`, abort?"err":"ok");
  }catch(err){ setStatus("Error al imprimir: "+(err.message||err.name||err),"err"); }
  finally{ printing=false; $("print").disabled=false; $("stop").style.display="none"; }
};

// ---- detener envío ----
$("stop").onclick=async()=>{
  abort=true;
  setStatus("Deteniendo…","err");
  try{ if(writeChar) await writeChar.writeValue(new Uint8Array([0x1b,0x40])); }catch(e){}
};

render();
</script>
</body>
</html>
